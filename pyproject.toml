[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tocsmith"
version = "1.0.1"
description = "Forge navigable, finished PDFs from printed tables of contents."
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["pypdf>=6.18.1,<7"]

[project.scripts]
tocsmith = "toc_bookmarks.__main__:main"
toc-bookmarks = "toc_bookmarks.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
